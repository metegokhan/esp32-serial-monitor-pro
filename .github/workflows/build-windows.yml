name: "Build & Release (Windows & Linux)"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: |
          cd v2
          pnpm install

      - name: Build Tauri Application
        run: |
          cd v2
          pnpm tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Serial-Monitor-Pro-Windows
          path: |
            v2/src-tauri/target/release/bundle/nsis/*.exe
            v2/src-tauri/target/release/bundle/msi/*.msi
            v2/src-tauri/target/release/*.exe

  build-linux:
    name: Build Linux (.AppImage & .deb)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd v2
          pnpm install

      - name: Build Tauri Application
        run: |
          cd v2
          pnpm tauri build

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Serial-Monitor-Pro-Linux
          path: |
            v2/src-tauri/target/release/bundle/appimage/*.AppImage
            v2/src-tauri/target/release/bundle/deb/*.deb
            v2/src-tauri/target/release/bundle/rpm/*.rpm

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0' }}
          files: |
            release-files/**/*.exe
            release-files/**/*.msi
            release-files/**/*.AppImage
            release-files/**/*.deb
            release-files/**/*.rpm
